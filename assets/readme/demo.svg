<rect x="58.0" y="348" width="138.5" height="48" rx="15" fill="#26262a"/>
<text x="69.0" y="368" fill="#f2f2f7" font-size="12">Want the best-rated</text>
<text x="69.0" y="384" fill="#f2f2f7" font-size="12">sections for these?</text>
<rect x="218.3" y="404" width="63.7" height="32" rx="15" fill="#0a84ff"/>
<text x="229.3" y="424" fill="#ffffff" font-size="12">yes pls</text>
<rect x="58.0" y="444" width="195.0" height="32" rx="15" fill="#26262a"/>
<text x="69.0" y="464" fill="#f2f2f7" font-size="12">On it. Shortlist in a few min.</text>
<text x="170.0" y="618" fill="#8b949e" font-size="13" text-anchor="middle" font-weight="500">Reads your official major map</text>
