<text x="379.0" y="472" fill="#f2f2f7" font-size="12">the second a seat opens.</text>
<text x="480.0" y="618" fill="#8b949e" font-size="13" text-anchor="middle" font-weight="500">Checks ASU every 15 minutes</text>
